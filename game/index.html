<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa Verde — Sunset Boulevard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f14;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; color: #fff; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  /* warm grade over the 3D frame: darker corners, a breath of sunset at the top */
  #grade { position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background:
      linear-gradient(180deg, rgba(255,140,60,.10), rgba(0,0,0,0) 26%),
      radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 55%, rgba(10,4,10,.42) 100%); }
  .hud { position: fixed; z-index: 5; text-shadow: 0 2px 6px rgba(0,0,0,.65); }
  #cashbox { top: 18px; left: 22px; }
  #cash { font-size: 30px; font-weight: 800; letter-spacing: .04em; color: #8df0a0; }
  #jobline { margin-top: 2px; font-size: 14px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: #ffd9a0; max-width: 430px; }
  #objective { font-size: 14px; color: #fff; opacity: .92; max-width: 430px; }
  #stars { top: 16px; right: 24px; font-size: 30px; letter-spacing: .18em; color: #3d3d46; }
  #stars .lit { color: #ffd23e; }
  #minimap { left: 22px; bottom: 22px; width: 176px; height: 176px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,.35); background: rgba(8,10,18,.55); }
  #speedo { right: 26px; bottom: 24px; text-align: right; }
  #speed { font-size: 40px; font-weight: 800; }
  #speedo small { display: block; font-size: 11px; letter-spacing: .3em; opacity: .8; }
  #healthwrap { right: 26px; bottom: 96px; width: 150px; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,.18); overflow: hidden; }
  #health { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5d47, #ffb347); }
  #banner { top: 24%; left: 0; right: 0; text-align: center; pointer-events: none;
    font-size: 44px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
    opacity: 0; transition: opacity .35s ease; color: #ffe9c4; }
  #banner small { display: block; font-size: 16px; font-weight: 600; letter-spacing: .22em; color: #fff; }
  #toast { top: 64px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700;
    letter-spacing: .08em; opacity: 0; transition: opacity .3s ease; color: #aef3ff; }
  #dialog { left: 50%; bottom: 34px; transform: translateX(-50%); width: min(680px, 86vw);
    background: linear-gradient(180deg, rgba(12,8,16,.88), rgba(12,8,16,.78));
    border-left: 4px solid #ffb347; border-radius: 6px; padding: 14px 20px 12px; display: none; }
  #dialog .who { font-size: 13px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #ffb347; }
  #dialog .line { margin-top: 4px; font-size: 19px; line-height: 1.35; }
  #dialog .hint { margin-top: 6px; font-size: 11px; letter-spacing: .18em; opacity: .55; text-transform: uppercase; }
  #phonemenu { left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(430px, 88vw);
    background: rgba(10,8,16,.92); border: 1px solid rgba(255,255,255,.22); border-radius: 14px;
    padding: 22px 26px; display: none; z-index: 8; }
  #phonemenu h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #aef3ff; }
  #phonemenu .sub { font-size: 13px; opacity: .75; margin-bottom: 12px; }
  #phonemenu button { display: block; width: 100%; margin: 8px 0; padding: 12px 14px; text-align: left;
    font: 600 16px/1.2 inherit; color: #fff; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18); border-radius: 8px; cursor: pointer; }
  #phonemenu button:hover { background: rgba(255,179,71,.25); }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; cursor: pointer;
    background: linear-gradient(180deg, rgba(20,6,14,.18) 0%, rgba(20,6,14,.55) 78%, rgba(10,3,8,.85) 100%); }
  #start .kicker { font-size: 15px; font-weight: 700; letter-spacing: .55em; text-transform: uppercase; color: #ffd9a0; }
  #start h1 { margin: 6px 0 0; font-size: clamp(56px, 11vw, 118px); font-weight: 900; letter-spacing: .02em;
    line-height: .95; color: #fff;
    text-shadow: 0 4px 0 #ff7e3d, 0 10px 34px rgba(0,0,0,.6); }
  #start h2 { margin: 4px 0 0; font-size: clamp(20px, 3.4vw, 34px); font-weight: 800;
    letter-spacing: .42em; text-transform: uppercase; color: #7ee6f5; }
  #start .pitch { margin-top: 26px; font-size: clamp(13px, 1.8vw, 18px); font-weight: 700;
    letter-spacing: .3em; color: #ffe9c4; }
  #start .go { margin-top: 40px; font-size: 15px; font-weight: 700; letter-spacing: .26em;
    text-transform: uppercase; animation: pulse 1.6s ease-in-out infinite; }
  #start .keys { margin-top: 14px; font-size: 12px; letter-spacing: .14em; opacity: .72; }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  #fader { position: fixed; inset: 0; background: #000; z-index: 9; pointer-events: none;
    opacity: 0; transition: opacity .5s ease; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="grade"></div>

<div class="hud" id="cashbox">
  <div id="cash">$0</div>
  <div id="jobline"></div>
  <div id="objective"></div>
</div>
<div class="hud" id="stars"></div>
<canvas class="hud" id="minimap" width="176" height="176"></canvas>
<div class="hud" id="healthwrap"><div id="health"></div></div>
<div class="hud" id="speedo"><span id="speed">0</span><small>MPH</small></div>
<div class="hud" id="banner"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="dialog"><div class="who"></div><div class="line"></div><div class="hint">Enter ▸</div></div>
<div class="hud" id="phonemenu"></div>
<div id="fader"></div>

<div id="start">
  <div class="kicker">Welcome to</div>
  <h1>COSTA VERDE</h1>
  <h2>Sunset Boulevard</h2>
  <div class="pitch">SEVEN JOBS · ONE SUNSET · EVERY COP IN THE CITY</div>
  <div class="go">Click to roll</div>
  <div class="keys">WASD drive · Space handbrake · Enter talk / confirm · M phone · P pause</div>
</div>

<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
