<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa Verde — Sunset Boulevard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1024; font-family: 'Segoe UI', Arial, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #hud-top { position: absolute; top: 14px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: flex-start; }
  #hud-money { font-size: 30px; font-weight: 800; color: #7dff5e; text-shadow: 0 2px 8px rgba(0,0,0,.65); letter-spacing: .5px; }
  #hud-health { width: 190px; height: 10px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.35); border-radius: 5px; margin-top: 6px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #7dff5e; transition: width .15s; }
  #hud-right { text-align: right; }
  #hud-stars { font-size: 26px; color: #ffd23e; text-shadow: 0 2px 8px rgba(0,0,0,.7); letter-spacing: 3px; opacity: .25; }
  #hud-timer { font-size: 22px; font-weight: 700; color: #ffe9b0; text-shadow: 0 2px 6px rgba(0,0,0,.7); opacity: 0; margin-top: 2px; }
  #hud-objective { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); max-width: 52%;
    background: rgba(10,10,18,.55); border: 1px solid rgba(255,210,62,.5); border-radius: 8px; padding: 7px 16px;
    font-size: 16px; font-weight: 600; color: #ffe9b0; text-align: center; opacity: 0; transition: opacity .25s; }
  #minimap { position: absolute; right: 18px; bottom: 18px; width: 148px; height: 148px; border: 2px solid rgba(255,255,255,.35);
    border-radius: 10px; background: #141a24; opacity: .92; }
  #hud-hint { position: absolute; bottom: 178px; right: 18px; width: 148px; text-align: center; font-size: 13px;
    color: #ffe9b0; text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .2s; }
  /* ---------- dialogue ---------- */
  #dialogue { position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 12px); width: min(680px, 86vw);
    background: linear-gradient(180deg, rgba(16,12,26,.88), rgba(16,12,26,.94)); border: 1px solid rgba(255,93,162,.55);
    border-left: 5px solid #ff5da2; border-radius: 10px; padding: 13px 18px 11px; opacity: 0; transition: all .22s; }
  #dialogue-name { color: #ff8ac2; font-weight: 800; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
  #dialogue-text { font-size: 19px; line-height: 1.35; color: #fff; }
  #dialogue-next { color: rgba(255,255,255,.55); font-size: 12px; margin-top: 5px; letter-spacing: 1px; }
  /* ---------- banner + toast ---------- */
  #banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.94); text-align: center;
    opacity: 0; transition: all .25s; }
  #banner-title { font-size: 54px; font-weight: 900; letter-spacing: 3px; color: #ffd23e;
    text-shadow: 0 0 22px rgba(255,120,60,.8), 0 3px 10px rgba(0,0,0,.8); }
  #banner-sub { font-size: 21px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.85); margin-top: 2px; }
  #toast { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); background: rgba(10,10,18,.72);
    border-radius: 8px; padding: 8px 18px; font-size: 16px; font-weight: 600; color: #ffe9b0; opacity: 0; transition: opacity .25s; }
  /* ---------- title ---------- */
  #title { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(20,8,30,.18) 0%, rgba(20,8,30,.0) 40%, rgba(20,8,30,.55) 100%); color: #fff; text-align: center; }
  #title h1 { font-size: 92px; margin: 0; font-weight: 900; letter-spacing: 6px; line-height: .95;
    background: linear-gradient(180deg, #ffe9b0 15%, #ff9a3c 55%, #ff5da2 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255,110,60,.45)); }
  #title h2 { font-size: 34px; margin: 2px 0 10px; font-weight: 300; letter-spacing: 14px; color: #ffd9ec; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #title-pitch { font-size: 19px; font-weight: 800; letter-spacing: 4px; color: #ffe9b0; text-shadow: 0 2px 10px rgba(0,0,0,.75); }
  #title-sub { margin-top: 26px; font-size: 16px; color: rgba(255,255,255,.85); text-shadow: 0 1px 6px #000; }
  #title-controls { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.55); letter-spacing: 1px; }
  #vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 180px rgba(20,0,10,.55); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Costa Verde: a golden-hour open-world crime game"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div id="hud-top">
    <div>
      <div id="hud-money">$250</div>
      <div id="hud-health"><div id="hud-health-fill"></div></div>
    </div>
    <div id="hud-right">
      <div id="hud-stars">☆☆☆☆☆</div>
      <div id="hud-timer"></div>
    </div>
  </div>
  <div id="hud-objective"></div>
  <canvas id="minimap" width="148" height="148"></canvas>
  <div id="hud-hint"></div>
  <div id="dialogue">
    <div id="dialogue-name"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-next">E ▸</div>
  </div>
  <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="toast"></div>
</div>
<div id="title">
  <h1>COSTA VERDE</h1>
  <h2>SUNSET BOULEVARD</h2>
  <div id="title-pitch">SEVEN JOBS · ONE SUNSET · EVERY COP IN THE CITY</div>
  <div id="title-sub">Click to play</div>
  <div id="title-controls">WASD move &amp; drive · E interact / enter car · F shoot · Shift run · Space handbrake · P pause</div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
